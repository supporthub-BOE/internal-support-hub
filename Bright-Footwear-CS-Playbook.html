<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bright Footwear Customer Support Playbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FA; --panel:#FFFFFF; --ink:#18233A; --muted:#5B6680; --line:#DCE1EB;
  --navy:#1E3A6E; --sun:#F2B705; --sun-ink:#5A4300; --sun-soft:#FFF4CC;
  --plum:#7E4A9B; --plum-soft:#F2E8F7; --ok:#1F7A4D; --ok-soft:#E3F4EA; --warn:#A33A2B; --warn-soft:#FBE7E3;
  --chip:#EAEFF7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121826; --panel:#1A2233; --ink:#E7ECF5; --muted:#A1ACC2; --line:#2C3650;
    --navy:#8FB0EA; --sun:#F2B705; --sun-ink:#FFE08A; --sun-soft:#3A3115;
    --plum:#C99BE0; --plum-soft:#2E2238; --ok:#6FCF9B; --ok-soft:#173326; --warn:#F09A8C; --warn-soft:#3A1F1B;
    --chip:#232D42;
  }
}
:root[data-theme="dark"]{
  --bg:#121826; --panel:#1A2233; --ink:#E7ECF5; --muted:#A1ACC2; --line:#2C3650;
  --navy:#8FB0EA; --sun:#F2B705; --sun-ink:#FFE08A; --sun-soft:#3A3115;
  --plum:#C99BE0; --plum-soft:#2E2238; --ok:#6FCF9B; --ok-soft:#173326; --warn:#F09A8C; --warn-soft:#3A1F1B;
  --chip:#232D42;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3{font-family:"Outfit","Nunito Sans",system-ui,sans-serif;line-height:1.2;margin:0}
a{color:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow-y:auto}
.logo{font-family:Outfit,sans-serif;font-weight:700;font-size:1.25rem;padding:0 8px 4px}
.logo small{display:block;font-family:"Nunito Sans",sans-serif;font-weight:600;font-size:.8rem;color:var(--muted)}
.nav{list-style:none;padding:0;margin:20px 0 0}
.nav button{width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;font-weight:600;display:flex;gap:10px;align-items:center}
.nav button:hover{background:var(--chip)}
.nav button[aria-current="page"]{background:var(--navy);color:var(--panel)}
.nav .sep{height:1px;background:var(--line);margin:10px 8px}
.nav .badge{margin-left:auto;font-size:.72rem;background:var(--sun);color:#3A2B00;border-radius:999px;padding:1px 8px}

.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:16px 32px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(20,30,60,.15);max-height:360px;overflow:auto;display:none}
.results.open{display:block}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 14px;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus-visible{background:var(--chip)}
.results small{color:var(--muted)}
.brand-toggle{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--bg)}
.brand-toggle button{border:0;background:none;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.9rem}
.brand-toggle button[aria-pressed="true"][data-b="bright"]{background:var(--sun);color:#3A2B00}
.brand-toggle button[aria-pressed="true"][data-b="renesia"]{background:var(--plum);color:#fff}

main{min-width:0}
.view{max-width:860px;padding:32px;margin:0 auto}
.hero h1{font-size:clamp(1.9rem,4vw,2.6rem);font-weight:700}
.hero p{color:var(--muted);max-width:62ch;font-size:1.08rem}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:24px 0 0}
.picker + .section{margin-top:36px}
.pick{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:left}
.pick:hover{border-color:var(--navy)}
.pick strong{display:block;font-family:Outfit,sans-serif;font-size:1.1rem}
.pick span{color:var(--muted);font-size:.92rem}
.pick.main{border:2px solid var(--sun);background:var(--sun-soft)}
.section{margin:32px 0}
.section h2{font-size:1.35rem;margin-bottom:10px}
.prose{max-width:68ch}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;padding:10px 0 10px 44px;position:relative;border-bottom:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;left:0;top:10px;width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--panel);display:grid;place-items:center;font-weight:700;font-family:Outfit,sans-serif}
.brands{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.brandcard{border-radius:14px;padding:16px;border:1px solid var(--line);background:var(--panel)}
.brandcard.bright{border-left:6px solid var(--sun)}
.brandcard.renesia{border-left:6px solid var(--plum)}

.ch-head h1{font-size:clamp(1.6rem,3.5vw,2.2rem)}
.ch-head p{color:var(--muted);margin:6px 0 0}
.tabs{display:flex;gap:4px;margin:22px 0 20px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--navy)}

.note{border-radius:12px;padding:12px 16px;margin:0 0 18px;font-size:.95rem}
.note.bright{background:var(--sun-soft);color:var(--ink);border-left:5px solid var(--sun)}
.note.renesia{background:var(--plum-soft);border-left:5px solid var(--plum)}
.note.rule{background:var(--warn-soft);border-left:5px solid var(--warn)}
.note b{display:block;margin-bottom:2px}

/* Decision flow — the centrepiece */
.trail{list-style:none;padding:0;margin:0 0 14px}
.trail li{display:flex;gap:10px;align-items:baseline;padding:6px 0;color:var(--muted);font-size:.93rem}
.trail li button{background:none;border:0;padding:0;color:var(--navy);text-decoration:underline;font-size:.85rem}
.trail .ans{color:var(--ink);font-weight:700}
.qcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}
.qcard h3{font-size:1.3rem;margin-bottom:6px}
.qcard .hint{color:var(--muted);margin:0 0 14px;font-size:.95rem}
.opts{display:grid;gap:10px}
.opts button{text-align:left;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-weight:600}
.opts button:hover{border-color:var(--navy);background:var(--chip)}
.result{border:2px solid var(--ok);background:var(--ok-soft)}
.result h3::before{content:"✓ ";color:var(--ok)}
.result ol{margin:8px 0 14px;padding-left:22px}
.result.esc{border-color:var(--warn);background:var(--warn-soft)}
.result.esc h3::before{content:"! ";color:var(--warn)}
.macros{display:flex;flex-direction:column;gap:8px}
.macro{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.macro a{font-weight:700;text-decoration:none;font-size:.85rem;white-space:nowrap;padding:6px 10px;border-radius:8px;background:var(--navy);color:var(--panel)}
.flow-actions{display:flex;gap:10px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 14px;font-weight:700}
.btn.primary{background:var(--navy);color:var(--panel);border-color:var(--navy)}
@media (prefers-reduced-motion:no-preference){.qcard{animation:pop .22s ease-out}}
@keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}

.linklist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.linklist a{display:block;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:600}
.linklist a:hover{border-color:var(--navy)}
.linklist small{display:block;color:var(--muted);font-weight:400}
.group{margin-bottom:22px}
.group h3{font-size:1.02rem;margin-bottom:8px}
.tickets{display:flex;flex-wrap:wrap;gap:8px}
.tickets a{font-size:.88rem;background:var(--chip);border-radius:8px;padding:5px 10px;text-decoration:none}
.filter{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;margin-bottom:12px}

.quiz .qq{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.quiz .qq p{font-weight:700;margin:0 0 10px}
.quiz .opts button.correct{border-color:var(--ok);background:var(--ok-soft)}
.quiz .opts button.wrong{border-color:var(--warn);background:var(--warn-soft)}
.quiz .why{margin:10px 0 0;font-size:.93rem;color:var(--muted)}
.score{font-family:Outfit,sans-serif;font-size:1.1rem;font-weight:600}

.news{border-left:3px solid var(--line);padding-left:20px;margin-left:6px}
.news article{position:relative;margin-bottom:26px}
.news article::before{content:"";position:absolute;left:-28px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--sun);border:3px solid var(--bg)}
.news time{font-weight:700;color:var(--muted);font-size:.9rem}
.news h3{font-size:1.1rem;margin:2px 0 6px}
.news ul{margin:6px 0;padding-left:20px}

.hdr-link{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:10px;background:var(--navy);color:var(--panel);font-weight:700;text-decoration:none;font-size:.92rem;white-space:nowrap}
.hdr-link:hover{opacity:.9}
.navlabel{font-size:.8rem;font-weight:700;color:var(--muted);padding:14px 12px 4px}
details.faq{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:0 16px}
details.faq summary{cursor:pointer;padding:14px 0;font-weight:700;list-style:none;display:flex;gap:10px;align-items:center}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";margin-left:auto;font-size:1.2rem;color:var(--muted)}
details.faq[open] summary::after{content:"−"}
.tag{font-size:.75rem;font-weight:700;background:var(--chip);color:var(--navy);border-radius:999px;padding:2px 10px;white-space:nowrap}
.script{background:var(--bg);border-left:4px solid var(--navy);border-radius:8px;padding:12px 14px;margin:0 0 10px;font-style:italic}
.fnote{font-size:.93rem;color:var(--muted);margin:0 0 14px}
.tbl{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:.95rem}
.tbl th,.tbl td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{background:var(--chip)}
.plist{padding-left:20px;margin:0}.plist li{margin-bottom:8px}
.tmpl{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.86rem;overflow-x:auto}
.picklabel{font-family:Outfit,sans-serif;font-size:1.05rem;margin:28px 0 -10px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.duocard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.duocard span{color:var(--muted);font-size:.94rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--sun);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px;font-size:.93rem;color:var(--muted)}
.stat .num{font-family:Outfit,sans-serif;font-size:2rem;font-weight:700;color:var(--ink);line-height:1}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.tool:hover{border-color:var(--navy)}
.tool .ti{font-size:1.4rem}
.tool small{display:block;color:var(--muted)}
@media (max-width:860px){.duo,.tools{grid-template-columns:1fr}.stats{grid-template-columns:1fr}}
.mobile-nav{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mobile-nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .mobile-nav button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 12px;white-space:nowrap;font-weight:600;font-size:.9rem}
  .mobile-nav button[aria-current="page"]{background:var(--navy);color:var(--panel);border-color:var(--navy)}
  .top{padding:12px 16px}
  .view{padding:20px 16px}
  .brands{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside aria-label="Playbook sections">
    <div class="logo">Bright Footwear<small>Support Playbook · for new agents</small></div>
    <ul class="nav" id="nav"></ul>
  </aside>
  <main>
    <div class="top">
      <div class="search">
        <label for="q" class="sr" style="position:absolute;left:-9999px">Search playbook</label>
        <input id="q" type="search" placeholder="Search macros or topics, e.g. “damaged”, “tracking”" autocomplete="off">
        <div class="results" id="results" role="listbox"></div>
      </div>
      <a class="hdr-link" href="https://www.bright-footwear.com/" target="_blank" rel="noopener">🌐 Bright Footwear website</a>
    </div>
    <div class="mobile-nav" id="mnav"></div>
    <div class="view" id="view"></div>
  </main>
</div>

<script>
const MDB = "https://docs.google.com/spreadsheets/d/1fg2Gf-RG-2zm8O9k30uOtvajyaGFeveIcLZtubw9aw4/edit#rangeid=";
const M = {
  r30:["Refund - Not possible because 30+ days","1287094640"],
  rLate2:["Return too late - Second explanation","1053979656"],
  rLate3:["Return too late - Third (and last) explanation","419728133"],
  askReason:["Special - Ask for reason of return","81674575"],
  missPics:["Order - Ask for pictures of missing items","432677683"],
  twoShip:["Order - Send in 2 separate shipments","1080508126"],
  missReship:["Order - Missing item (Reship confirmation)","1163788647"],
  dmgPics:["Damage - Ask for pictures","1958433417"],
  dmgReship:["Order - Damaged item (Reship confirmation)","924899981"],
  dmgNotUs:["Damage - Damaged not our fault","4921284"],
  wrongReship:["Reship (if wrong items received)","1222270059"],
  wrongConf:["Order - Wrong item (Reship confirmation)","319118046"],
  color:["Product - Issues Color Of Product","23799581"],
  used:["Return - Used Shoes","1551530699"],
  three:["Return - 3 Options (new)","1362027897"],
  opt1:["Accepted option 2 - Next step Return Store Credit","42446509"],
  opt1track:["Accepted option 2 - Return tracking received - Pending voucher","1245457366"],
  receipt:["Return - Ask For Return Receipt","1194810452"],
  lateReceipt:["Return - too late (according to receipt)","1963568993"],
  wrongAddr:["Refund - Return to wrong address (no refund possible)","327880190"],
  pending:["Refund - Already submitted pending for review","1014062720"],
  delay:["Status - Delay in Fulfilment","190371265"],
  onway:["Status - Order on the way","2138685422"],
  dest:["Status - In destination country","1873239470"],
  delivered:["Status - Delivered","1442168890"],
  unf35:["Status - Unfulfilled - within 3-5 days","153672966"],
  unf5:["Status - Unfulfilled more than 5 days","2035220703"],
  unf5b:["Status - Unfulfilled more than 5 days (second email)","2035220703"],
  podYes:["Reship - Package not received by customer (With POD)","1969525270"],
  podNo:["Reship - Package not received by customer (No POD)","432433842"],
  cancel1:["Cancelation - Explanation Policy","1473480106"],
  cancel2:["Cancelation - Explanation Policy - Email 2","39595577"],
  ex30:["Exchange - Not possible because 30+ days","737039116"],
  exNoProd:["Exchange - Accept Option 1 (Customer did not mention exchange product)","1056630559"],
  exInvoice:["Exchange - Accept Option 1 (Invoice send to Customer)","545457265"]
};
const mlink = k => MDB + M[k][1];
const L = {
  refund:"https://docs.google.com/document/d/1Bq0kya9ZpxLAWVtC8esvePT_N4asnYErumyD-WxHcjc/edit?tab=t.0#heading=h.qc6jiuz2kcrm",
  mdb:"https://docs.google.com/spreadsheets/d/1fg2Gf-RG-2zm8O9k30uOtvajyaGFeveIcLZtubw9aw4/edit?gid=133717234#gid=133717234",
  status:"https://docs.google.com/document/d/16AbTTGxUAgmLpVkSArk_K35gdbhgD_-RY4qSDmKe4uc/edit#heading=h.oh85zy1ktco3",
  cancel:"https://docs.google.com/document/d/16x1_xt1JWu8eiQmE8HTZUxGt2j1Wn2bsC1LQ9e1nCr8/edit#heading=h.3pxdpdqb44pg",
  exchange:"https://docs.google.com/document/d/1BY-NJGcEk8TEV2vMpocDFvSX9D3OC1COY2xxBKqVKeY/edit#heading=h.zhmne5ce5i29",
  returnSheet:"https://docs.google.com/spreadsheets/d/1NBgHDcod4Y8-GXv9lQKZHnbi5rGMCqaIyJuSJ0e6IsM/edit?gid=0#gid=0",
  sizeChart:"https://docs.google.com/spreadsheets/d/1uXgqk_nMDc89oROLl8rFbNGKs7VAkVoCH91dnr05jiw/edit?gid=623723052#gid=623723052",
  spg:"https://docs.google.com/document/d/1p_Wge6FepMcD023bqO12QoZvEUcmUVmHHmtnk8DROTg/edit?tab=t.0#heading=h.ng3nmxvfjtub",
  cheat:"https://docs.google.com/document/d/1thm4Lm0v4EijxyfYR5eMQw5_sNXVYwLoezy3awnqY40/edit?tab=t.0#heading=h.kd5l7f2uke0z",
  phoneSop:"https://drive.google.com/file/d/1TcsEDNRTa5_JCM2fauqbM_xMiXbpij6f/view",
  phoneGuide:"https://docs.google.com/document/d/1K1R1Ai4_4LgjQQ93EHo8vb14yP_wZwAfMxeq6x40lDc/edit?tab=t.0",
  phoneFu:"https://docs.google.com/document/d/1M0o3mXelZc2nvIFxgYHW7wZ9L7Mr8pY7LwK3h9MvsPg/edit?tab=t.0#heading=h.397lndlkrvjk",
  callLog:"https://docs.google.com/spreadsheets/d/1PK5cQzYDlu9YVztK-BYQAM67OLjFwuUzc05lDgGCeNA/edit?gid=848892810#gid=848892810",
  quo:"https://my.quo.com/inbox/PNyVlvLx0e/c/CN4b85d2c877ad4647a8b404ddc698e174",
  customs:"https://docs.google.com/document/d/1Eg7PMw6CtlEdD5ol7pt4hWnoViVUES3MlYsarC6JYCw/edit",
  problemSheets:"https://drive.google.com/drive/folders/1cHTC89e20aBSsfetIvPzR08S3eYqlnMQ",
  psLoom:"https://www.loom.com/share/d64b090fbb644f59897221a1ed870a70",
  localTrack:"https://www.loom.com/share/d3874d2dcba3451bac0069a79eec7699?sid=32665cc5-a174-403d-8a08-1150450997f6"
};
const ZB = n => "https://brightfootwear.zendesk.com/agent/tickets/"+n;

const CH = {
returns:{
  title:"How can I return?", icon:"↩️", short:"Returns, damaged, wrong or missing items",
  intro:"Our most common request. Figure out what really happened first: a mistake on our side is handled very differently from a change of mind.",
  notes:{
    bright:"Footwear tip: if the customer says the shoes don't fit, offer the options in this order: 1) exchange for another size, 2) store credit with an additional $20, 3) refund as the last offer. Worn shoes fall under the “Used Shoes” macro."
  },
  rules:[
    "The return window is 30 days. Watch the Loom on how to count the deadline before you tell a customer they're too late.",
    "Option 3 (refund): wait until the return is accepted in our return warehouse before refunding. Check the Return Sheet to see if it has been received."
  ],
  flow:{
    start:{q:"What is the customer telling you?",o:[["The item arrived damaged","dmg"],["They got the wrong item","wrong"],["Something is missing from the order","miss"],["The colour looks different from the photos","color"],["They want to return it (changed mind, doesn't fit)","why"],["They already sent it back","sent"]]},

const FAQ = [
  ["General","Where are you located?","We're an online-based store, so you can shop with us anytime from anywhere! We do have a physical office at Bright Enterprise LLC, 30 N Gould St, Suite N, Sheridan, WY 82801 — but all purchases and support are handled online.","Don't offer the office address as a walk-in location. It's for admin only."],
  ["Shipping","I can't track my shipment / no local tracking","I completely understand how frustrating that can be, and I'm sorry for the inconvenience! I've already flagged this with our team, and we're looking into it right away. You can expect an update by tomorrow. We'll keep you in the loop via email — or if you prefer, we can give you a call tomorrow. Which works best for you?","Always ask for their preferred contact method and log their callback time."],
  ["Order","I want to cancel (already processed)","I totally understand, and I appreciate you reaching out! Unfortunately, because your order has already been processed and is on its way, we're unable to cancel it at this point. But once you receive it, I'm confident you'll love it! If for any reason you're not satisfied, our team is always here to help.","Do NOT offer a refund. Be empathetic but firm."],
  ["Order","I want to cancel (placed 5–10 minutes ago)","I completely understand, thank you for reaching out so quickly! Let me check your order status right away. If it hasn't been picked up by our fulfilment team, I'll do my best to cancel it. [If cancelled:] Great news, your order is cancelled and you'll get a confirmation email shortly. [If not:] I'm so sorry, your order has already moved into processing. Once it arrives, our team will be happy to help you with a return.","Always check Shopify before confirming either way. If not possible, move to the returns process and don't offer a refund on the call."],
  ["Promo","Why is the phone discount 5% but 20% on the website?","Great question! The discounts we offer over the phone are separate from the promotions on our website. Our website runs its own exclusive deals that may not always be available by phone. We recommend checking the website directly — we'd love for you to get the best deal possible!","Don't promise to match the website discount unless authorised."],

function renderNav(){

    const cur = route.page===p[0]?' aria-current="page"':"";
    const badge = p[0]==="news"?'<span class="badge">'+NEWS.length+'</span>':"";
    return `<li><button data-go="${p[0]}"${cur}><span aria-hidden="true">${p[1]}</span>${esc(p[2])}${badge}</button></li>`;

function chapter(k){
  const c = CH[k];
  const tabs = (c.tabs||[["flow","Guided flow"],["policy","Policy & videos"],["macros","Macros"],["examples","Examples"],["quiz","Quiz"]]).map(t=>t[0]==="quiz"?[t[0],t[1]+(quizDone[k]?" ✓":"")]:t);
  let body="";
  if(route.tab==="flow") body = flowView(k);
  if(route.tab==="policy") body = `${c.rules.map(r=>`<div class="note rule"><b>Rule</b>${esc(r)}</div>`).join("")}<ul class="linklist">${c.policy.map(p=>`<li><a href="${p[1]}" target="_blank" rel="noopener">${esc(p[0])}${p[2]?`<small>${esc(p[2])}</small>`:""}</a></li>`).join("")}</ul>`;
  if(route.tab==="macros") body = `<input class="filter" id="mf" placeholder="Filter macros…" aria-label="Filter macros"><div class="macros" id="ml">${macroList(c.macros)}</div>`;
  if(route.tab==="examples") body = `<p style="color:var(--muted);margin-top:0">Real Bright Footwear tickets handled the right way.</p>${c.examples.map(g=>`<div class="group"><h3>${esc(g[0])}</h3><div class="tickets">${g[1].map(u=>`<a href="${u}" target="_blank" rel="noopener">#${u.split("/").pop()}</a>`).join("")}</div></div>`).join("")}`;
  if(route.tab==="quiz") body = quizView(k);
  if(RENDER[route.tab]) body = RENDER[route.tab]();
  return `<div class="ch-head"><h1>${c.icon} ${esc(c.title)}</h1><p>${esc(c.intro)}</p></div>

  ${brandNote(c)}${body}`;
}

function macroList(keys){return keys.map(m=>`<div class="macro" data-name="${esc(M[m][0].toLowerCase())}"><span>${esc(M[m][0])}</span><a href="${mlink(m)}" target="_blank" rel="noopener">Open macro</a></div>`).join("")}

function flowView(k){
  const f = CH[k].flow;
  const trail = path.slice(0,-1).map((id,i)=>{
    const node=f[id], next=path[i+1];
    const ans=(node.o.find(o=>o[1]===next)||[""])[0];
    return `<li><span>${esc(node.q)}</span> <span class="ans">${esc(ans)}</span> <button data-back="${i}">change</button></li>`;
  }).join("");
  const cur = f[path[path.length-1]];
  let card;
  if(cur.r){
    card = `<div class="qcard result${cur.esc?" esc":""}"><h3>${esc(cur.r)}</h3><ol>${cur.s.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${cur.m.length||cur.lk?`<div class="macros">${macroList(cur.m)}${(cur.lk||[]).map(l=>`<div class="macro"><span>${esc(l[0].replace("Open ",""))}</span><a href="${l[1]}" target="_blank" rel="noopener">Open</a></div>`).join("")}</div>`:""}
    <div class="flow-actions"><button class="btn primary" data-restart>Start a new ticket</button>${cur.go?`<button class="btn" data-go="${cur.go}">Open ${esc(CH[cur.go].title)}</button>`:""}</div></div>`;
  } else {
    card = `<div class="qcard"><h3>${esc(cur.q)}</h3>${cur.h?`<p class="hint">${esc(cur.h)}</p>`:'<p class="hint">Choose one.</p>'}
    <div class="opts">${cur.o.map(o=>`<button data-next="${o[1]}">${esc(o[0])}</button>`).join("")}</div>
    ${path.length>1?`<div class="flow-actions"><button class="btn" data-back="${path.length-2}">Back</button></div>`:""}</div>`;
  }
  return `${trail?`<ol class="trail">${trail}</ol>`:""}${card}`;
}

function quizView(k){
  const qs = CH[k].quiz;

  return `<div class="ch-head"><h1>📄 Hard copy sheets</h1><p>The full written documents behind this playbook. Open these when you need the complete policy text.</p></div>
  <ul class="linklist" style="margin-top:24px">
  <li><a href="${L.spg}" target="_blank" rel="noopener">[Bright Footwear] Store Policy Guidelines<small>General guidelines, Zendesk handling, escalations and store policies</small></a></li>
  <li><a href="${L.refund}" target="_blank" rel="noopener">[Bright Footwear] Refund Policy V3<small>All return and refund rules</small></a></li>
  <li><a href="${L.cheat}" target="_blank" rel="noopener">[Bright Footwear] Customer Support Cheat Sheet v2.0<small>Original cheat sheet with all chapters, macros and examples</small></a></li>
  </ul>`;
}

function help(){
  return `<div class="ch-head"><h1>🎥 Helpful videos & questions</h1></div>
  <div class="section"><h2>Videos</h2><ul class="linklist">
  <li><a href="https://www.loom.com/share/b174f410e5b64a809e2f112603db8185" target="_blank" rel="noopener">Introduction video<small>Watch this first</small></a></li>
  <li><a href="https://www.loom.com/share/ba58eec085a54be29ebed03b71084210" target="_blank" rel="noopener">How to set reminders in Zendesk and Slack</a></li>
  <li><a href="https://www.loom.com/share/16d641e74dab41e3be1c144b4c6edf2e" target="_blank" rel="noopener">Finding the local courier faster</a></li>
  <li><a href="https://www.loom.com/share/b6fc793e0ca04e4aaf929ee93196ea59" target="_blank" rel="noopener">Issuing store credit via Rise App</a></li>
  <li><a href="${L.mdb}" target="_blank" rel="noopener">Full Macro Database<small>Revised June 2025</small></a></li>
  <li><a href="https://docs.google.com/document/d/1thm4Lm0v4EijxyfYR5eMQw5_sNXVYwLoezy3awnqY40/edit" target="_blank" rel="noopener">Cheat Sheet v2.0 (document copy)</a></li></ul></div>
  <div class="section"><h2>Got a question that isn't covered?</h2><p class="prose">Post it in your team's open-questions thread or the Open Questions section of the document copy. We'll set up the workflow and add it here.</p></div>`;
}

function render(){
  renderNav();
  const v = $("#view");
  if(route.page==="home") v.innerHTML = home();
  else if(route.page==="news") v.innerHTML = news();
  else if(route.page==="help") v.innerHTML = help();
  else if(route.page==="sheets") v.innerHTML = sheets();
  else if(route.page==="spg") v.innerHTML = spg();
  else v.innerHTML = chapter(route.page);
  
}

function go(page,tab){route={page,tab:tab||(CH[page]&&CH[page].tabs?CH[page].tabs[0][0]:"flow")};path=["start"];render();window.scrollTo(0,0);try{history.replaceState(null,"","#"+page)}catch(e){}}

document.addEventListener("click",e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.go){go(t.dataset.go);closeResults();return}
  if(t.dataset.tab){route.tab=t.dataset.tab;path=["start"];render();return}
  if(t.dataset.next){path.push(t.dataset.next);render();$(".qcard")&&$(".qcard").scrollIntoView({block:"nearest"});return}
  if(t.dataset.back!==undefined){path=path.slice(0,+t.dataset.back+1);render();return}
  if(t.hasAttribute("data-restart")){path=["start"];render();return}
  if(t.dataset.b){brand=t.dataset.b;store.set("pb-brand",brand);render();return}
  if(t.dataset.ans!==undefined){
    const qq=t.closest(".qq"); if(qq.dataset.done) return;
    const k=t.closest("#quiz").dataset.ch, q=CH[k].quiz[+qq.dataset.i], j=+t.dataset.ans;
    qq.dataset.done=j===q.a?"1":"0";
    qq.querySelectorAll("button").forEach((b,i)=>{if(i===q.a)b.classList.add("correct");else if(i===j)b.classList.add("wrong")});
    qq.insertAdjacentHTML("beforeend",`<p class="why">${j===q.a?"Correct. ":"Not quite. "}${esc(q.w)}</p>`);
    const all=[...document.querySelectorAll(".qq")];
    if(all.every(x=>x.dataset.done)){
      const sc=all.filter(x=>x.dataset.done==="1").length;
      $("#score").textContent=`You got ${sc} of ${all.length}. ${sc===all.length?"Nice work — you're ready for your 1:1 check-in.":"Review the flow and try again."}`;
      if(sc===all.length){quizDone[k]=true;store.set("pb-quiz",quizDone)}
    }
  }
});

document.addEventListener("click",e=>{const a=e.target.closest("a[data-golink]");if(a){e.preventDefault();go(a.dataset.golink)}});
document.addEventListener("input",e=>{
  if(e.target.id==="mf"){const q=e.target.value.toLowerCase();document.querySelectorAll("#ml .macro").forEach(m=>m.style.display=m.dataset.name.includes(q)?"":"none")}
});

// global search
const INDEX = [];
Object.entries(CH).forEach(([k,c])=>{
  INDEX.push({label:c.icon+" "+c.title,sub:c.short,act:()=>go(k)});
  c.macros.forEach(m=>INDEX.push({label:M[m][0],sub:"Macro · "+c.title,url:mlink(m)}));
});
INDEX.push({label:"📘 Store Policy Guidelines",sub:"Guide · restocking fee, Zendesk, Slack format",act:()=>go("spg")},{label:"Phone scripts & FAQs",sub:"Phone support",act:()=>go("phone","scripts")},{label:"Store Policy Guidelines (doc)",sub:"Hard copy sheet",url:L.spg},{label:"Refund Policy V3",sub:"Hard copy sheet",url:L.refund},{label:"Cheat Sheet v2.0",sub:"Hard copy sheet",url:L.cheat});
NEWS.forEach(n=>INDEX.push({label:n.t,sub:"What's new · "+n.d,act:()=>go("news")}));
const seen=new Set(); const IDX=INDEX.filter(i=>{const key=i.label+(i.url||"");if(seen.has(key))return false;seen.add(key);return true});
function closeResults(){$("#results").classList.remove("open")}
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim().toLowerCase(), box=$("#results");
  if(!q){closeResults();return}
  const hits=IDX.filter(i=>(i.label+" "+i.sub).toLowerCase().includes(q)).slice(0,12);
  box.innerHTML = hits.length?hits.map((h,i)=>`<button data-hit="${IDX.indexOf(h)}">${esc(h.label)}<br><small>${esc(h.sub)}</small></button>`).join(""):`<button disabled>No matches. Try “refund”, “tracking” or “damage”.</button>`;
  box.classList.add("open");
});
$("#results").addEventListener("click",e=>{
  const b=e.target.closest("button[data-hit]"); if(!b) return;
  const h=IDX[+b.dataset.hit]; closeResults(); $("#q").value="";
  if(h.url) window.open(h.url,"_blank","noopener"); else h.act();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeResults()});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))closeResults()});

const start=(location.hash||"").slice(1);
if(start&&(CH[start]||start==="news"||start==="help"||start==="sheets"||start==="spg")) route.page=start;
render();
</script>
</body>
</html>
